{% extends "base.html" %}

{% block title %}Edit Transaction | Expense Tracker{% endblock %}

{% block content %}
<section class="page-title">
    <h1>Edit transaction</h1>
</section>

<form class="form-panel" method="post">
    <label for="date">Date</label>
    <input id="date" name="date" type="date" value="{{ transaction.date }}" required>

    <label for="amount">Amount</label>
    <input id="amount" name="amount" type="number" min="0" step="0.001" value="{{ transaction.amount }}" required>

    <label for="merchant">Merchant</label>
    <input id="merchant" name="merchant" type="text" value="{{ transaction.merchant }}" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        {% for category in categories %}
            <option value="{{ category }}" {% if category == transaction.category %}selected{% endif %}>
                {{ category }}
            </option>
        {% endfor %}
    </select>

    <label for="source">Source</label>
    <input id="source" name="source" type="text" value="{{ transaction.source }}" required>

    <button class="button" type="submit">Save changes</button>
</form>
{% endblock %}
